<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まるごと入門A1 かつどう — 听力字幕课堂助手</title>
<link rel="stylesheet" href="style.css?v=20261027-4">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div>
      <span class="brand-ja">まるごと 入門A1 かつどう</span>
      <span class="brand-zh">听力字幕课堂助手</span>
    </div>
  </div>
  <nav class="lesson-tabs" id="lessonTabs" aria-label="课程选择"></nav>
  <div class="top-actions">
    <label class="switch" title="一个音轨播放结束后自动播放下一个">
      <input type="checkbox" id="autoNext" checked>
      <span class="slider"></span>
      <span class="switch-label">连播</span>
    </label>
    <label class="switch" title="播放时字幕列表自动滚动到当前句">
      <input type="checkbox" id="followSub" checked>
      <span class="slider"></span>
      <span class="switch-label">跟随滚动</span>
    </label>
    <label class="switch" title="在汉字上方显示假名注音">
      <input type="checkbox" id="furigana" checked>
      <span class="slider"></span>
      <span class="switch-label">假名</span>
    </label>
  </div>
</header>

<main class="layout">
  <aside class="track-panel panel">
    <div class="panel-head">
      <h2 id="lessonTitle"></h2>
      <p id="lessonMeta" class="panel-sub"></p>
    </div>
    <div class="track-list" id="trackList" role="listbox" aria-label="音轨列表"></div>
  </aside>

  <section class="sub-panel panel">
    <div class="panel-head sub-head">
      <h2 id="trackTitle">请选择音轨</h2>
      <p id="trackMeta" class="panel-sub"></p>
    </div>
    <div class="subtitles" id="subtitles"></div>
  </section>

  <section class="book-panel panel">
    <div class="panel-head book-head">
      <h2>课本页面</h2>
      <button class="drill-btn" id="drillBtn" title="汉字假名输入练习">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        练习
      </button>
      <div class="page-nav">
        <button class="icon-btn" id="prevPage" title="上一页" aria-label="上一页">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="pageIndicator" class="page-indicator">—</span>
        <button class="icon-btn" id="nextPage" title="下一页" aria-label="下一页">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="page-view" id="pageView">
      <div class="page-stage" id="pageStage">
        <img id="pageImg" alt="课本页面">
        <div class="page-marks" id="pageMarks"></div>
      </div>
    </div>
    <div class="page-strip" id="pageStrip"></div>
  </section>
</main>

<footer class="player-bar">
  <button class="icon-btn big" id="prevTrack" title="上一音轨" aria-label="上一音轨">
    <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM7 4H5v16h2V4z" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn big play" id="playPause" title="播放/暂停（空格）" aria-label="播放或暂停">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn big" id="nextTrack" title="下一音轨" aria-label="下一音轨">
    <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM17 4h2v16h-2V4z" fill="currentColor"/></svg>
  </button>
  <div class="progress-wrap">
    <span class="time" id="timeCur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="播放进度">
    <span class="time" id="timeDur">0:00</span>
  </div>
  <div class="rate-wrap">
    <select id="rate" title="播放速度" aria-label="播放速度">
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1.0×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
  </div>
  <audio id="audio" preload="metadata"></audio>
</footer>

<div class="drill-overlay" id="drillOverlay" hidden>
  <div class="drill-modal" role="dialog" aria-label="汉字假名练习">
    <div class="drill-head">
      <div>
        <h2 id="drillTitle">汉字假名练习</h2>
        <p class="drill-sub" id="drillSub">看汉字，输入假名读音</p>
      </div>
      <button class="icon-btn" id="drillClose" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drill-progress" id="drillProgress"></div>
    <div class="drill-stage">
      <div class="drill-kanji" id="drillKanji"></div>
      <div class="drill-sentence" id="drillSentence"></div>
    </div>
    <div class="drill-answer">
      <span class="drill-mark" id="drillMark"></span>
      <input id="drillInput" type="text" inputmode="kana" autocomplete="off"
             autocapitalize="off" spellcheck="false" placeholder="输入假名读音"
             aria-label="假名读音">
      <button class="drill-submit" id="drillSubmit">确定</button>
    </div>
    <div class="drill-result" id="drillResult" hidden>
      <div class="drill-score" id="drillScore"></div>
      <button class="drill-submit" id="drillRetry">再来一次</button>
    </div>
  </div>
</div>

<script src="data.js?v=1793081596"></script>
<script src="app.js?v=20261027-6"></script>
</body>
</html>
